---
- name: "[ ZOOM ]"
  hosts: all

  vars:
    _zoom_state: "{{ zoom_state | default('present') }}"
    _zoom_pkg_name: zoom
    _zoom_pkg_version: "{{ zoom_pkg_version | default('7.2.5') }}"
    _zoom_pkg_subversion: "{{ zoom_pkg_subversion | default('6661') }}"
    _zoom_checksum: "{{ zoom_checksum | default('7f71d2ac6ab3e70365f596cdb9436ce61eb68d1070a42471b1ff1b758acc1906c73071843565887fef3a3190aeb64837ef8ad5293fad447b984a8e7aeb1f0a58') }}"
    _zoom_build_dir: "/tmp/zoom-build"

  tasks:

    - name: Remove current build
      become: true
      become_user: "{{ aur_builder_user }}"
      kewlfft.aur.aur:
        name: "{{ _zoom_pkg_name }}"
        state: "absent"

    - name: Install zoom if required
      when: _zoom_state == 'present'
      block:

        - name: Ensure zoom build dir is present
          ansible.builtin.file:
            path: "{{ _zoom_build_dir }}"
            state: directory
            mode: "0755"

        - name: Copy PKGBUILD to build dir
          ansible.builtin.template:
            src: ../templates/zoom.pkgbuild.j2
            dest: "{{ _zoom_build_dir }}/PKGBUILD"
            mode: "0644"

        - name: Execute makepkg from local PKGBUILD
          become: true
          become_user: "{{ aur_builder_user }}"
          kewlfft.aur.aur:
            name: "{{ _zoom_pkg_name }}"
            state: "{{ _zoom_state }}"
            use: makepkg
            local_pkgbuild: "{{ _zoom_build_dir }}"

        - name: Clean up zoom build dir
          ansible.builtin.file:
            path: "{{ _zoom_build_dir }}"
            state: absent
