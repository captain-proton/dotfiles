---
- name: "[ ZOOM ]"
  hosts: all

  vars:
    _zoom_state: "{{ zoom_state | default('present') }}"
    _zoom_pkg_name: zoom
    _zoom_pkg_version: "{{ zoom_pkg_version | default('7.2.1') }}"
    _zoom_pkg_subversion: "{{ zoom_pkg_subversion | default('5760') }}"
    _zoom_checksum: "{{ zoom_checksum | default('12272ae2626e4de50683b4198bedb5c87940337e8586a6ec01d3078f7e7810537f1d8584531dcfc4840c2c3c0a034a2bf4005630e8d4211b489b3360effb7dd3') }}"
    _zoom_build_dir: "/tmp/zoom-build"

  tasks:

    - name: Remove current build
      become: true
      become_user: "{{ aur_builder_user }}"
      kewlfft.aur.aur:
        name: "{{ _zoom_pkg_name }}"
        state: "absent"

    - name: Install zoom if required
      when: _zoom_state == 'present'
      block:

        - name: Ensure zoom build dir is present
          ansible.builtin.file:
            path: "{{ _zoom_build_dir }}"
            state: directory
            mode: "0755"

        - name: Copy PKGBUILD to build dir
          ansible.builtin.template:
            src: ../templates/zoom.pkgbuild.j2
            dest: "{{ _zoom_build_dir }}/PKGBUILD"
            mode: "0644"

        - name: Execute makepkg from local PKGBUILD
          become: true
          become_user: "{{ aur_builder_user }}"
          kewlfft.aur.aur:
            name: "{{ _zoom_pkg_name }}"
            state: "{{ _zoom_state }}"
            use: makepkg
            local_pkgbuild: "{{ _zoom_build_dir }}"

        - name: Clean up zoom build dir
          ansible.builtin.file:
            path: "{{ _zoom_build_dir }}"
            state: absent
